<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>家庭小账本 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        /* 基础设置 */
        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        
        /* 样式组件 */
        .nav-active { color: #4f46e5 !important; }
        .nav-active i { transform: translateY(-2px); transition: transform 0.2s; }
        .nav-item { transition: all 0.2s; color: #94a3b8; }
        
        @keyframes breathe { 0%,100% { box-shadow: 0 4px 20px -5px rgba(99,102,241,0.2); } 50% { box-shadow: 0 4px 30px 0px rgba(167,139,250,0.4); } }
        .card-glow { animation: breathe 6s ease-in-out infinite; }
        
        /* 类别按钮通用样式 */
        .cat-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 16px; padding: 10px 0; transition: all 0.2s; background: transparent; cursor: pointer; }
        .cat-icon-circle { width: 48px; height: 48px; background: #f1f5f9; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 6px; transition: all 0.2s; }
        .cat-btn:active { transform: scale(0.95); }
        .cat-btn.active .cat-icon-circle { background: #4f46e5; color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4); transform: scale(1.1); }
        .cat-btn span { font-size: 12px; color: #64748b; font-weight: 500; }
        .cat-btn.active span { color: #4f46e5; font-weight: 600; }

        /* 输入控件 */
        .date-pill { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; color: #475569; outline: none; text-align: center; max-width: 130px; }
        .date-list-input { text-align: right; background: transparent; font-family: inherit; color: #334155; font-weight: 500; width: 160px; outline: none; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

        /* 编辑弹窗动画 */
        #edit-modal { transition: opacity 0.3s; }
        #edit-modal.hidden { opacity: 0; pointer-events: none; }
        #edit-modal:not(.hidden) { opacity: 1; pointer-events: auto; }
        #edit-modal-content { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        #edit-modal.hidden #edit-modal-content { transform: translateY(100%); }
        #edit-modal:not(.hidden) #edit-modal-content { transform: translateY(0); }

        /* 打印样式 */
        @media print {
            @page { size: A4; margin: 1.5cm; }
            body { overflow: visible !important; background: white !important; height: auto !important; }
            #main-app-container, #edit-modal { display: none !important; }
            #print-container { display: block !important; position: absolute; top: 0; left: 0; width: 100%; background: white; color: black; font-family: serif; }
            .print-header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
            .print-title { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
            .print-meta { font-size: 12px; color: #666; display: flex; justify-content: space-between; }
            .print-table { width: 100%; border-collapse: collapse; font-size: 12px; }
            .print-table th { border-bottom: 1px solid #000; text-align: left; padding: 8px 4px; font-weight: bold; background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; }
            .print-table td { border-bottom: 1px solid #ddd; padding: 8px 4px; vertical-align: top; }
            .print-table tr:nth-child(even) { background-color: #f9fafb !important; -webkit-print-color-adjust: exact; }
            .print-amount { text-align: right; font-family: monospace; font-weight: bold; }
            .print-type-rigid { font-weight: bold; }
            .print-footer { margin-top: 20px; text-align: right; font-size: 14px; font-weight: bold; border-top: 2px solid #333; padding-top: 10px; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 select-none">
    
    <!-- 打印容器 -->
    <div id="print-container" class="hidden"></div>

    <!-- 编辑弹窗 (Bottom Sheet) -->
    <div id="edit-modal" class="hidden fixed inset-0 z-[100] flex items-end justify-center">
        <!-- 遮罩层 -->
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeEditModal()"></div>
        <!-- 弹窗内容 -->
        <div id="edit-modal-content" class="relative bg-white w-full max-w-md rounded-t-[32px] p-6 shadow-2xl flex flex-col max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-slate-800">修改记录</h3>
                <button onclick="closeEditModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-5 pb-safe">
                <!-- 1. 金额与日期 -->
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="text-xs text-slate-400 block mb-1.5 ml-1">金额</label>
                        <div class="relative">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">¥</span>
                            <input id="edit-amount" type="number" step="0.01" class="w-full pl-7 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-lg focus:outline-none focus:border-indigo-500 focus:bg-white transition-colors">
                        </div>
                    </div>
                    <div class="w-1/3">
                        <label class="text-xs text-slate-400 block mb-1.5 ml-1">日期</label>
                        <input id="edit-date" type="date" class="w-full px-2 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-center focus:outline-none focus:border-indigo-500 focus:bg-white transition-colors">
                    </div>
                </div>

                <!-- 2. 分类选择 (弹窗专用) -->
                <div>
                    <label class="text-xs text-slate-400 block mb-2 ml-1">分类</label>
                    <div id="edit-category-grid" class="grid grid-cols-5 gap-y-3 gap-x-2"></div>
                </div>

                <!-- 3. 刚性与备注 -->
                <div class="flex gap-3">
                    <label class="shrink-0 flex flex-col items-center justify-center bg-slate-50 w-16 rounded-xl cursor-pointer border border-transparent hover:border-slate-200 transition-colors">
                        <input id="edit-isRigid" type="checkbox" class="w-5 h-5 accent-indigo-500 rounded mb-1">
                        <span class="text-xs font-medium text-slate-500">刚性</span>
                    </label>
                    <div class="flex-1">
                         <input id="edit-desc" type="text" placeholder="备注 (可选)" class="w-full h-full px-4 bg-slate-50 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100 border border-transparent focus:bg-white">
                    </div>
                </div>

                <!-- 4. 保存按钮 -->
                <button onclick="saveEdit()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-2xl font-bold text-lg shadow-lg shadow-indigo-200 active:scale-[0.98] transition-all">保存修改</button>
            </div>
        </div>
    </div>

    <!-- 主应用容器 -->
    <div id="main-app-container" class="w-full max-w-md mx-auto h-full bg-slate-50 flex flex-col relative shadow-2xl overflow-hidden">
        
        <!-- Header -->
        <div class="shrink-0 relative bg-indigo-600 rounded-b-[40px] shadow-lg z-20 overflow-hidden">
            <div class="absolute top-0 right-0 w-40 h-40 bg-white opacity-5 rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none"></div>
            <div class="absolute bottom-0 left-0 w-32 h-32 bg-indigo-400 opacity-20 rounded-full blur-2xl -ml-10 -mb-10 pointer-events-none"></div>
            <header class="pt-10 pb-20 px-6 relative">
                <div class="relative flex justify-between items-start">
                    <div>
                        <div class="text-indigo-100 text-sm mb-1">本月总支出</div>
                        <div id="total-month" class="font-bold text-4xl tracking-tight text-white">¥0.00</div>
                    </div>
                    <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center backdrop-blur-sm text-white">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                </div>
            </header>
        </div>

        <!-- 统计卡片 -->
        <div class="shrink-0 px-6 -mt-12 relative z-30 flex gap-4 mb-2 pointer-events-none">
            <div class="pointer-events-auto flex-1 bg-white p-3 rounded-2xl shadow-md flex items-center justify-between ring-1 ring-slate-100">
                <div>
                    <div class="text-[10px] text-slate-400">刚性支出</div>
                    <div class="font-bold text-emerald-500 text-lg" id="rigid-count">0</div>
                </div>
                <div class="w-8 h-8 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-500 text-xs"><i class="fa-solid fa-lock"></i></div>
            </div>
            <div class="pointer-events-auto flex-1 bg-white p-3 rounded-2xl shadow-md flex items-center justify-between ring-1 ring-slate-100">
                <div>
                    <div class="text-[10px] text-slate-400">非刚性支出</div>
                    <div class="font-bold text-amber-500 text-lg" id="non-rigid-count">0</div>
                </div>
                <div class="w-8 h-8 rounded-full bg-amber-50 flex items-center justify-center text-amber-500 text-xs"><i class="fa-solid fa-coffee"></i></div>
            </div>
        </div>

        <!-- 内容区域 -->
        <div class="flex-1 overflow-y-auto pt-4 pb-32 px-4 no-scrollbar scroll-smooth relative z-10" id="content-area">
            
            <!-- 1. 首页 -->
            <div id="page-home" class="space-y-5">
                <div class="bg-white rounded-[32px] p-5 shadow-sm card-glow border border-slate-100/50">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-slate-800 font-bold text-lg">记一笔</h2>
                        <input id="date" type="date" class="date-pill">
                    </div>
                    <div class="relative mb-6">
                        <div class="absolute left-0 top-1/2 -translate-y-1/2 text-slate-400 text-2xl font-light">¥</div>
                        <input id="amount" type="number" step="0.01" placeholder="0.00" class="w-full text-center text-4xl font-bold py-2 bg-transparent border-b-2 border-slate-100 focus:border-indigo-500 focus:outline-none text-slate-800 placeholder-slate-200 transition-colors">
                    </div>
                    <div id="category-grid" class="grid grid-cols-5 gap-y-4 gap-x-2 mb-6"></div>
                    <div class="flex items-center gap-2">
                        <label class="shrink-0 flex flex-col items-center justify-center bg-slate-50 w-12 h-[52px] rounded-xl cursor-pointer border border-transparent hover:border-slate-200 transition-colors">
                            <input id="isRigid" type="checkbox" class="w-4 h-4 accent-indigo-500 rounded mb-1">
                            <span class="text-[10px] font-medium text-slate-500 leading-none">刚性</span>
                        </label>
                        <input id="desc" type="text" placeholder="备注..." class="flex-1 min-w-0 h-[52px] px-4 bg-slate-50 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100">
                        <button onclick="addExpense()" class="shrink-0 bg-indigo-600 hover:bg-indigo-700 text-white w-16 h-[52px] rounded-xl shadow-lg shadow-indigo-200 flex items-center justify-center transition-transform active:scale-95"><i class="fa-solid fa-check text-xl"></i></button>
                    </div>
                </div>
                <div class="px-2">
                    <h3 class="font-bold text-slate-800 mb-3 text-sm">最近记录</h3>
                    <div id="recent-list" class="space-y-3"></div>
                </div>
            </div>

            <!-- 2. 记录页 -->
            <div id="page-records" class="hidden space-y-4">
                <div id="quick-filters" class="flex gap-2 overflow-x-auto no-scrollbar pb-1"></div>
                <div id="custom-date-panel" class="hidden bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                    <h3 class="text-xs text-slate-400 font-bold mb-3 uppercase tracking-wider">选择时间段</h3>
                    <div class="bg-slate-50 rounded-2xl border border-slate-200 mb-4 overflow-hidden">
                        <div class="flex items-center justify-between p-3 border-b border-slate-200 active:bg-slate-100 transition-colors">
                            <span class="text-sm text-slate-500 pl-1">开始日期</span>
                            <input id="custom-start" type="date" class="date-list-input">
                        </div>
                        <div class="flex items-center justify-between p-3 active:bg-slate-100 transition-colors">
                            <span class="text-sm text-slate-500 pl-1">结束日期</span>
                            <input id="custom-end" type="date" class="date-list-input">
                        </div>
                    </div>
                    <button onclick="applyCustomFilter()" class="w-full bg-slate-900 text-white py-3 rounded-xl text-sm font-bold shadow-lg shadow-slate-200">应用筛选</button>
                </div>
                <div class="flex justify-between items-center px-1">
                    <h3 class="font-bold text-lg">明细列表</h3>
                    <select id="year-filter" onchange="renderRecords()" class="bg-white border-none text-sm text-slate-500 font-medium focus:outline-none"></select>
                </div>
                <div id="records-list" class="space-y-3"></div>
            </div>

            <!-- 3. 分析页 -->
            <div id="page-analysis" class="hidden space-y-5">
                <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 mb-4 text-sm flex items-center gap-2"><i class="fa-solid fa-calendar-days text-indigo-500"></i> 分析区间</h3>
                    <div class="bg-slate-50 rounded-2xl border border-slate-200 mb-5 overflow-hidden">
                        <div class="flex items-center justify-between p-3.5 border-b border-slate-200 active:bg-slate-100 transition-colors">
                            <span class="text-sm text-slate-500 font-medium pl-1">开始日期</span>
                            <input id="start-date" type="date" class="date-list-input">
                        </div>
                        <div class="flex items-center justify-between p-3.5 active:bg-slate-100 transition-colors">
                            <span class="text-sm text-slate-500 font-medium pl-1">结束日期</span>
                            <input id="end-date" type="date" class="date-list-input">
                        </div>
                    </div>
                    <button onclick="runAnalysis()" class="w-full bg-indigo-600 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-indigo-200 active:scale-95 transition-transform flex items-center justify-center gap-2"><i class="fa-solid fa-chart-simple"></i> 生成报表</button>
                </div>
                <div id="analysis-result" class="hidden space-y-5">
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 text-center relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-20 h-20 bg-indigo-50 rounded-full blur-xl -mr-5 -mt-5"></div>
                        <div class="text-xs text-slate-400 mb-1 relative z-10">区间总支出</div>
                        <div id="total-expense" class="text-4xl font-bold text-indigo-600 tracking-tight relative z-10">¥0.00</div>
                    </div>
                    <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                        <h4 class="font-bold text-sm mb-4">支出构成</h4>
                        <div class="h-56 flex items-center justify-center"><canvas id="category-chart"></canvas></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100">
                            <h4 class="font-bold text-xs mb-2">刚性占比</h4>
                            <canvas id="rigid-chart" height="150"></canvas>
                        </div>
                        <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100 flex flex-col justify-center items-center">
                           <div class="text-xs text-slate-400">主要消费</div>
                           <div class="font-bold text-indigo-600 mt-1" id="top-category">-</div>
                        </div>
                    </div>
                    <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                        <h4 class="font-bold text-sm mb-4">每月趋势</h4>
                        <canvas id="monthly-chart" height="200"></canvas>
                    </div>

                    <!-- 财务健康度 (新增) -->
                    <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                        <h4 class="font-bold text-sm mb-3 flex items-center gap-2">
                            <i class="fa-solid fa-user-doctor text-indigo-500"></i> 财务健康度
                        </h4>
                        <div class="bg-slate-50 rounded-xl p-4">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs text-slate-500">刚性支出占比</span>
                                <span id="rigid-ratio-val" class="font-bold text-slate-800 text-lg">0.0%</span>
                            </div>
                            <div class="w-full bg-slate-200 rounded-full h-2 mb-3">
                                <div id="rigid-ratio-bar" class="bg-indigo-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                            </div>
                            <p id="health-check-text" class="text-xs text-slate-600 leading-relaxed font-medium"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4. 工具页 -->
            <div id="page-tools" class="hidden space-y-4">
                <div class="bg-white rounded-3xl p-6 shadow-sm mb-6">
                    <h2 class="font-bold text-lg mb-1">数据管理</h2>
                    <p class="text-xs text-slate-400">数据仅存储在您的设备本地</p>
                    <div id="storage-info" class="mt-3 text-[11px] text-slate-500 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                        存储状态：检测中...
                    </div>
                    <div id="backup-info" class="mt-2 text-[11px] text-slate-500 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                        备份状态：暂无记录
                    </div>
                </div>
                <button onclick="printData()" class="w-full bg-white active:bg-slate-50 border border-slate-200 py-4 rounded-2xl flex items-center justify-between px-6 transition-colors group hover:border-indigo-300">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-colors"><i class="fa-solid fa-print"></i></div>
                        <span class="font-medium text-slate-700">打印 / 导出报表 (A4)</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
                </button>
                <button onclick="exportData()" class="w-full bg-white active:bg-slate-50 border border-slate-200 py-4 rounded-2xl flex items-center justify-between px-6 transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center"><i class="fa-solid fa-download"></i></div>
                        <span class="font-medium text-slate-700">备份数据 (JSON)</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
                </button>
                <label class="w-full bg-white active:bg-slate-50 border border-slate-200 py-4 rounded-2xl flex items-center justify-between px-6 cursor-pointer transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-green-50 text-green-500 flex items-center justify-center"><i class="fa-solid fa-upload"></i></div>
                        <span class="font-medium text-slate-700">恢复数据</span>
                    </div>
                    <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
                    <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
                </label>
                <button onclick="clearAllData()" class="w-full bg-white active:bg-slate-50 border border-slate-200 py-4 rounded-2xl flex items-center justify-between px-6 transition-colors group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-red-50 text-red-500 flex items-center justify-center group-hover:bg-red-500 group-hover:text-white transition-colors"><i class="fa-solid fa-trash"></i></div>
                        <span class="font-medium text-red-500">清空所有记录</span>
                    </div>
                </button>
            </div>
        </div>

        <!-- 底部导航 -->
        <nav class="absolute bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-slate-100 flex text-slate-400 z-50 pb-safe shadow-[0_-5px_20px_rgba(0,0,0,0.03)] h-[calc(60px+env(safe-area-inset-bottom))]">
            <button onclick="switchPage(0)" class="nav-item flex-1 flex flex-col items-center justify-center h-full nav-active" id="nav-0">
                <i class="fa-solid fa-house text-xl mb-1"></i><span class="text-[10px] font-medium">记账</span>
            </button>
            <button onclick="switchPage(1)" class="nav-item flex-1 flex flex-col items-center justify-center h-full" id="nav-1">
                <i class="fa-solid fa-rectangle-list text-xl mb-1"></i><span class="text-[10px] font-medium">明细</span>
            </button>
            <button onclick="switchPage(2)" class="nav-item flex-1 flex flex-col items-center justify-center h-full" id="nav-2">
                <i class="fa-solid fa-chart-pie text-xl mb-1"></i><span class="text-[10px] font-medium">统计</span>
            </button>
            <button onclick="switchPage(3)" class="nav-item flex-1 flex flex-col items-center justify-center h-full" id="nav-3">
                <i class="fa-solid fa-gear text-xl mb-1"></i><span class="text-[10px] font-medium">设置</span>
            </button>
        </nav>
    </div>

    <script>
        // --- 核心数据 ---
        let expenses = [];
        let selectedCategory = ''; // 首页用的
        let editSelectedCategory = ''; // 编辑弹窗用的
        let currentEditId = null; // 当前正在编辑的ID
        let categoryChart, rigidChart, monthlyChart;
        let currentFilter = 'thisMonth';
        let customStart = '', customEnd = '';
        let recordsGroups = [];
        let recordsGroupHeights = [];
        let recordsGroupHeightsByDate = new Map();
        let recordsTotalHeight = 0;
        let currentPageIndex = 0;
        let recordsRenderPending = false;
        let recordsHeightUpdatePending = false;
        const RECORD_ITEM_HEIGHT = 72;
        const RECORD_HEADER_HEIGHT = 28;
        const RECORD_GROUP_MARGIN = 16;
        const RECORD_OVERSCAN_PX = 320;

        const categories = [
            {name:'餐饮',emoji:'🍜'}, {name:'出行',emoji:'🚕'}, 
            {name:'子女',emoji:'🧸'}, {name:'日用',emoji:'🧼'},
            {name:'娱乐',emoji:'🎮'}, {name:'医疗',emoji:'💊'}, 
            {name:'水电',emoji:'💡'}, {name:'通讯',emoji:'📱'},
            {name:'服装',emoji:'👕'}, {name:'其他',emoji:'🧩'}
        ];

        // --- 辅助函数 ---
        const STORAGE_KEY = 'familyExpenses';
        const DB_NAME = 'family-account';
        const DB_VERSION = 1;
        const DB_STORE = 'kv';
        const BACKUP_META_KEY = 'familyExpensesBackupMeta';
        let dbPromise = null;
        let storageWarned = false;
        const MAX_DESC_LEN = 200;
        const MAX_CATEGORY_LEN = 20;
        const MAX_ID_LEN = 64;
        const MAX_IMPORT_BYTES = 20 * 1024 * 1024;
        const MAX_IMPORT_RECORDS = 200000;
        const BACKUP_REMINDER_DAYS = 30;

        function supportsIndexedDB() {
            return typeof indexedDB !== 'undefined';
        }

        function openDb() {
            if (!supportsIndexedDB()) return Promise.resolve(null);
            if (dbPromise) return dbPromise;
            dbPromise = new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(DB_STORE)) {
                        db.createObjectStore(DB_STORE, { keyPath: 'key' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
            return dbPromise;
        }

        async function idbGet(key) {
            const db = await openDb();
            if (!db) return null;
            return new Promise((resolve, reject) => {
                const tx = db.transaction(DB_STORE, 'readonly');
                const store = tx.objectStore(DB_STORE);
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result ? req.result.value : null);
                req.onerror = () => reject(req.error);
            });
        }

        async function idbSet(key, value) {
            const db = await openDb();
            if (!db) return false;
            return new Promise((resolve) => {
                const tx = db.transaction(DB_STORE, 'readwrite');
                tx.oncomplete = () => resolve(true);
                tx.onabort = () => resolve(false);
                tx.onerror = () => resolve(false);
                tx.objectStore(DB_STORE).put({ key, value });
            });
        }

        async function idbClear() {
            const db = await openDb();
            if (!db) return false;
            return new Promise((resolve) => {
                const tx = db.transaction(DB_STORE, 'readwrite');
                tx.oncomplete = () => resolve(true);
                tx.onabort = () => resolve(false);
                tx.onerror = () => resolve(false);
                tx.objectStore(DB_STORE).clear();
            });
        }

        async function checkStorageUsage() {
            if (!navigator.storage || !navigator.storage.estimate) return;
            try {
                const estimate = await navigator.storage.estimate();
                if (!estimate || !estimate.quota) return;
                const ratio = estimate.usage / estimate.quota;
                if (ratio > 0.85 && !storageWarned) {
                    storageWarned = true;
                    const usedMb = (estimate.usage / 1024 / 1024).toFixed(1);
                    const quotaMb = (estimate.quota / 1024 / 1024).toFixed(1);
                    alert(`注意：已使用 ${usedMb}MB / ${quotaMb}MB 的存储空间，建议尽快备份并清理旧数据。`);
                }
            } catch (e) {
                console.warn('Storage estimate failed:', e);
            }
        }

        async function requestPersistentStorage() {
            if (!navigator.storage || !navigator.storage.persist) return;
            try {
                await navigator.storage.persist();
            } catch (e) {
                console.warn('Storage persist request failed:', e);
            }
        }

        async function updateStorageInfo() {
            const el = document.getElementById('storage-info');
            if (!el) return;
            let persistText = '持久化：未知';
            try {
                if (navigator.storage && navigator.storage.persisted) {
                    const persisted = await navigator.storage.persisted();
                    persistText = persisted ? '持久化：已启用' : '持久化：未启用';
                }
            } catch (e) {
                persistText = '持久化：未知';
            }

            let usageText = '';
            try {
                if (navigator.storage && navigator.storage.estimate) {
                    const est = await navigator.storage.estimate();
                    if (est && est.quota) {
                        const usedMb = (est.usage / 1024 / 1024).toFixed(1);
                        const quotaMb = (est.quota / 1024 / 1024).toFixed(1);
                        usageText = `用量：${usedMb}MB / ${quotaMb}MB`;
                    }
                }
            } catch (e) {
                usageText = '';
            }

            el.textContent = usageText ? `存储状态：${persistText}，${usageText}` : `存储状态：${persistText}`;
        }

        async function updateBackupInfo() {
            const el = document.getElementById('backup-info');
            if (!el) return;
            try {
                const meta = supportsIndexedDB() ? await idbGet(BACKUP_META_KEY) : null;
                const last = meta && meta.lastBackupAt ? meta.lastBackupAt : localStorage.getItem(BACKUP_META_KEY);
                if (last) {
                    const d = new Date(last);
                    if (!Number.isNaN(d.getTime())) {
                        el.textContent = `备份状态：上次备份 ${d.toLocaleString()}`;
                        const diffDays = Math.floor((Date.now() - d.getTime()) / (24 * 60 * 60 * 1000));
                        if (diffDays >= BACKUP_REMINDER_DAYS) {
                            el.textContent += `，已超过 ${diffDays} 天`;
                        }
                        return;
                    }
                }
            } catch (e) {
                console.warn('Backup meta read failed:', e);
            }
            el.textContent = '备份状态：暂无记录（建议尽快备份）';
        }

        async function saveBackupMeta() {
            const meta = { lastBackupAt: new Date().toISOString() };
            if (supportsIndexedDB()) {
                const ok = await idbSet(BACKUP_META_KEY, meta);
                if (!ok) {
                    try { localStorage.setItem(BACKUP_META_KEY, meta.lastBackupAt); } catch (e) {}
                }
            } else {
                try { localStorage.setItem(BACKUP_META_KEY, meta.lastBackupAt); } catch (e) {}
            }
            await updateBackupInfo();
        }

        async function initStorage() {
            await requestPersistentStorage();
            await checkStorageUsage();
            await updateStorageInfo();
            await updateBackupInfo();
            await maybeRemindBackup();
        }

        async function maybeRemindBackup() {
            try {
                const meta = supportsIndexedDB() ? await idbGet(BACKUP_META_KEY) : null;
                const last = meta && meta.lastBackupAt ? meta.lastBackupAt : localStorage.getItem(BACKUP_META_KEY);
                if (!last) return;
                const d = new Date(last);
                if (Number.isNaN(d.getTime())) return;
                const diffDays = Math.floor((Date.now() - d.getTime()) / (24 * 60 * 60 * 1000));
                if (diffDays >= BACKUP_REMINDER_DAYS) {
                    alert(`建议备份：距离上次备份已超过 ${diffDays} 天。`);
                }
            } catch (e) {
                console.warn('Backup reminder check failed:', e);
            }
        }

        function normalizeText(value, maxLen) {
            if (value === null || value === undefined) return '';
            let s = String(value);
            s = s.replace(/[\u0000-\u001F\u007F]/g, '').trim();
            if (maxLen && s.length > maxLen) s = s.slice(0, maxLen);
            return s;
        }

        function normalizeId(value) {
            const raw = normalizeText(value, MAX_ID_LEN);
            const cleaned = raw.replace(/[^a-zA-Z0-9_-]/g, '');
            return cleaned;
        }

        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function sanitizeExpense(item) {
            if (!item || typeof item !== 'object') return null;
            const amount = Number(item.amount);
            const date = normalizeText(item.date, 10);
            const category = normalizeText(item.category, MAX_CATEGORY_LEN);
            const desc = normalizeText(item.desc, MAX_DESC_LEN);
            const isRigid = !!item.isRigid;
            const id = normalizeId(item.id) || generateId();
            if (!amount || !date || !category) return null;
            return { id, date, amount, category, isRigid, desc };
        }

        function prepareImportData(raw) {
            const result = {
                total: Array.isArray(raw) ? raw.length : 0,
                valid: [],
                invalidCount: 0,
                duplicateIdCount: 0
            };
            if (!Array.isArray(raw)) return result;

            const seen = new Set();
            for (let i = 0; i < raw.length; i += 1) {
                const cleaned = sanitizeExpense(raw[i]);
                if (!cleaned) {
                    result.invalidCount += 1;
                    continue;
                }
                if (seen.has(cleaned.id)) {
                    cleaned.id = generateId();
                    result.duplicateIdCount += 1;
                }
                seen.add(cleaned.id);
                result.valid.push(cleaned);
            }
            return result;
        }

        // 安全解析 YYYY-MM-DD 为本地日期对象，避免 UTC 偏移导致的日期偏差
        function parseDate(dateStr) {
            if (!dateStr) return new Date();
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return new Date(parts[0], parts[1] - 1, parts[2]);
            }
            return new Date(dateStr); // 回退到默认解析
        }

        // 生成唯一ID (时间戳 + 随机数)
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }

        async function loadData() {
            // 迁移旧 localStorage 数据到 IndexedDB（如可用）
            try {
                const savedLocal = localStorage.getItem(STORAGE_KEY);
                if (savedLocal) {
                    const parsed = JSON.parse(savedLocal);
                    expenses = Array.isArray(parsed) ? parsed.map(sanitizeExpense).filter(Boolean) : [];
                    if (supportsIndexedDB()) {
                        const ok = await idbSet(STORAGE_KEY, expenses);
                        if (ok) localStorage.removeItem(STORAGE_KEY);
                    }
                    return;
                }
            } catch (e) {
                console.warn('LocalStorage migration failed:', e);
            }

            if (!supportsIndexedDB()) {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    const parsed = saved ? JSON.parse(saved) : [];
                    expenses = Array.isArray(parsed) ? parsed.map(sanitizeExpense).filter(Boolean) : [];
                } catch (e) {
                    expenses = [];
                }
                return;
            }

            try {
                const saved = await idbGet(STORAGE_KEY);
                expenses = Array.isArray(saved) ? saved.map(sanitizeExpense).filter(Boolean) : [];
            } catch (e) {
                console.warn('IndexedDB load failed:', e);
                expenses = [];
            }
        }

        async function saveData() {
            try {
                if (!supportsIndexedDB()) {
                    const data = JSON.stringify(expenses);
                    localStorage.setItem(STORAGE_KEY, data);
                    if (data.length > 4.5 * 1024 * 1024) {
                        alert('注意：您的数据量已接近存储上限 (5MB)，建议尽快备份并清理旧数据。');
                    }
                    return true;
                }

                const ok = await idbSet(STORAGE_KEY, expenses);
                if (!ok) {
                    alert('保存失败：可能存储空间已满，请先导出备份并清理旧数据。');
                    return false;
                }

                await checkStorageUsage();
                return true;
            } catch (e) {
                if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED') {
                    alert('保存失败：存储空间已满！请先导出备份，然后清理旧数据。');
                } else {
                    console.error('Save failed:', e);
                    alert('保存失败：请稍后再试。');
                }
                return false;
            }
        }

        async function addExpense() {
            const amountInput = document.getElementById('amount');
            const amount = parseFloat(amountInput.value);
            const date = document.getElementById('date').value;
            const isRigid = document.getElementById('isRigid').checked;
            const descInput = document.getElementById('desc');
            const desc = normalizeText(descInput.value, MAX_DESC_LEN);
            const safeCategory = normalizeText(selectedCategory, MAX_CATEGORY_LEN);

            if(!amount || !date || !safeCategory) { 
                amountInput.classList.add('bg-red-50');
                setTimeout(()=>amountInput.classList.remove('bg-red-50'), 200);
                if(!safeCategory) alert('请选择支出类型');
                return; 
            }

            // 使用 generateId() 替代 Date.now()
            const newItem = {id: generateId(), date, amount, category: safeCategory, isRigid, desc: desc || ''};
            expenses.unshift(newItem);
            const ok = await saveData();
            if (!ok) {
                expenses = expenses.filter(e => e.id !== newItem.id);
                return;
            }
            renderHome();
            
            const btn = document.querySelector('button[onclick="addExpense()"]');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-thumbs-up"></i>';
            setTimeout(() => { btn.innerHTML = originalHTML; }, 1000);

            amountInput.value = ''; descInput.value = '';
        }

        // 打开编辑弹窗
        function openEditModal(id) {
            // ID 现在可能是字符串，需要确保类型匹配（如果 id 是数字传递过来的话，虽然 generateId 返回字符串）
            // 为了兼容旧数据(数字ID)和新数据(字符串ID)，我们直接全等比较即可，因为传参时类型已确定
            const expense = expenses.find(e => e.id == id); // 使用 == 宽松匹配以兼容
            if(!expense) return;

            currentEditId = expense.id; // 确保保存时使用原始ID
            document.getElementById('edit-amount').value = expense.amount;
            document.getElementById('edit-date').value = expense.date;
            document.getElementById('edit-isRigid').checked = expense.isRigid;
            document.getElementById('edit-desc').value = expense.desc;
            editSelectedCategory = expense.category;

            renderEditCategoryGrid();
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');

        }

        // 保存修改
        async function saveEdit() {
            if(!currentEditId) return;
            const amount = parseFloat(document.getElementById('edit-amount').value);
            const date = document.getElementById('edit-date').value;
            const desc = normalizeText(document.getElementById('edit-desc').value, MAX_DESC_LEN);
            const safeCategory = normalizeText(editSelectedCategory, MAX_CATEGORY_LEN);
            
            if(!amount || !date || !safeCategory) {
                alert('金额、日期和分类不能为空');
                return;
            }

            const index = expenses.findIndex(e => e.id === currentEditId);
            if(index !== -1) {
                const prev = { ...expenses[index] };
                expenses[index] = {
                    ...expenses[index],
                    amount: amount,
                    date: date,
                    category: safeCategory,
                    isRigid: document.getElementById('edit-isRigid').checked,
                    desc: desc
                };
                const ok = await saveData();
                if (!ok) {
                    expenses[index] = prev;
                    return;
                }
                renderHome();
                renderRecords();
                closeEditModal();
            }
        }

        async function deleteExpense(id) {
            if(confirm('确定删除这条记录吗？')) {
                // 使用 loose equality (==) 兼容旧数据（数字ID）和新数据（字符串ID）
                const prev = expenses;
                expenses = expenses.filter(e => e.id != id);
                const ok = await saveData();
                if (!ok) {
                    expenses = prev;
                    return;
                }
                renderHome(); renderRecords();
            }
        }

        function renderRecords() {
            let filtered = expenses;
            const now = new Date();
            const y = now.getFullYear(), m = now.getMonth();

            if (currentFilter === 'thisMonth') filtered = expenses.filter(e => { const d = parseDate(e.date); return d.getFullYear() === y && d.getMonth() === m; });
            else if (currentFilter === 'lastMonth') filtered = expenses.filter(e => { const d = parseDate(e.date); return d.getFullYear() === y && d.getMonth() === m-1 || (m===0 && d.getMonth()===11 && d.getFullYear()===y-1); });
            else if (currentFilter === 'thisYear') filtered = expenses.filter(e => parseDate(e.date).getFullYear() === y);
            else if (currentFilter === 'custom' && customStart && customEnd) filtered = expenses.filter(e => e.date >= customStart && e.date <= customEnd);

            const yearSelect = document.getElementById('year-filter');
            const years = [...new Set(expenses.map(e => parseDate(e.date).getFullYear()))].sort((a,b)=>b-a);
            if(yearSelect.options.length <= 1) yearSelect.innerHTML = `<option value="">全部年份</option>` + years.map(y => `<option value="${y}">${y}年</option>`).join('');
            const selectedYear = yearSelect.value;
            if (selectedYear) filtered = filtered.filter(e => parseDate(e.date).getFullYear() == selectedYear);

            buildRecordsGroups(filtered);
            renderVirtualRecords(true);
        }

        function buildRecordsGroups(filtered) {
            recordsGroupHeightsByDate.clear();
            recordsGroups = [];
            recordsGroupHeights = [];
            recordsTotalHeight = 0;
            if (!filtered || filtered.length === 0) return;

            const dayTotals = new Map();
            const grouped = new Map();
            const dateOrder = [];

            for (let i = 0; i < filtered.length; i += 1) {
                const e = filtered[i];
                dayTotals.set(e.date, (dayTotals.get(e.date) || 0) + e.amount);
                if (!grouped.has(e.date)) {
                    grouped.set(e.date, []);
                    dateOrder.push(e.date);
                }
                grouped.get(e.date).push(e);
            }

            for (let i = 0; i < dateOrder.length; i += 1) {
                const date = dateOrder[i];
                const items = grouped.get(date) || [];
                const dayTotal = dayTotals.get(date) || 0;
                const cached = recordsGroupHeightsByDate.get(date);
                const estimated = RECORD_HEADER_HEIGHT + (items.length * RECORD_ITEM_HEIGHT) + RECORD_GROUP_MARGIN;
                const height = typeof cached === 'number' && cached > 0 ? cached : estimated;
                recordsGroups.push({ date, items, dayTotal, height });
                recordsGroupHeights.push(height);
                recordsTotalHeight += height;
            }
        }

        function renderVirtualRecords(force) {
            if (currentPageIndex !== 1) return;
            const list = document.getElementById('records-list');
            const scroller = document.getElementById('content-area');
            if (!list || !scroller) return;

            if (!recordsGroups.length) {
                list.innerHTML = '<div class="flex flex-col items-center justify-center py-12 text-slate-300"><i class="fa-solid fa-clipboard-list text-4xl mb-2 opacity-50"></i><p class="text-xs">该筛选条件下没有记录</p></div>';
                return;
            }

            const top = list.offsetTop;
            const scrollTop = scroller.scrollTop;
            const viewTop = Math.max(0, scrollTop - top - RECORD_OVERSCAN_PX);
            const viewBottom = scrollTop - top + scroller.clientHeight + RECORD_OVERSCAN_PX;

            let startIdx = 0;
            let endIdx = recordsGroups.length - 1;
            let acc = 0;
            for (let i = 0; i < recordsGroups.length; i += 1) {
                const next = acc + recordsGroupHeights[i];
                if (next >= viewTop) { startIdx = i; break; }
                acc = next;
            }
            acc = 0;
            for (let i = 0; i < recordsGroups.length; i += 1) {
                acc += recordsGroupHeights[i];
                if (acc >= viewBottom) { endIdx = i; break; }
            }

            let topSpacer = 0;
            for (let i = 0; i < startIdx; i += 1) topSpacer += recordsGroupHeights[i];
            let bottomSpacer = 0;
            for (let i = endIdx + 1; i < recordsGroups.length; i += 1) bottomSpacer += recordsGroupHeights[i];

            let html = '';
            if (topSpacer > 0) html += `<div style="height:${topSpacer}px"></div>`;

            for (let i = startIdx; i <= endIdx; i += 1) {
                const g = recordsGroups[i];
                const safeDate = escapeHtml(g.date);
                html += `<div class="mb-4" data-date="${safeDate}"><div class="flex justify-between items-center px-2 mb-2"><span class="text-xs text-slate-400 font-medium">${safeDate}</span><span class="text-xs text-slate-400">支 ¥${g.dayTotal.toFixed(2)}</span></div><div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">`;
                const items = g.items;
                for (let idx = 0; idx < items.length; idx += 1) {
                    const e = items[idx];
                    const catObj = categories.find(c => c.name === e.category) || {emoji:'📄'};
                    const safeCategory = escapeHtml(e.category);
                    const safeDesc = e.desc ? escapeHtml(e.desc) : '';
                    const idParam = typeof e.id === 'string' ? `'${e.id}'` : e.id;
                    const isLast = (idx === items.length - 1);
                    html += `
                    <div class="p-4 flex justify-between items-center ${!isLast ? 'border-b border-slate-50' : ''}">
                        <div class="flex items-center gap-3">
                            <div class="text-xl w-8 text-center">${catObj.emoji}</div>
                            <div>
                                <div class="text-sm font-medium text-slate-700">${safeCategory} ${e.isRigid?'<i class="fa-solid fa-circle text-[6px] text-emerald-400 ml-1 align-middle"></i>':''}</div>
                                ${safeDesc ? `<div class="text-xs text-slate-400">${safeDesc}</div>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="font-bold text-slate-800 mr-2">¥${e.amount.toFixed(2)}</div>
                            <button onclick="openEditModal(${idParam})" class="text-indigo-400 w-8 h-8 flex items-center justify-center bg-indigo-50 rounded-lg"><i class="fa-solid fa-pen-to-square text-xs"></i></button>
                            <button onclick="deleteExpense(${idParam})" class="text-red-400 w-8 h-8 flex items-center justify-center bg-red-50 rounded-lg"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    </div>`;
                }
                html += `</div></div>`;
            }

            if (bottomSpacer > 0) html += `<div style="height:${bottomSpacer}px"></div>`;
            const sig = `${startIdx}-${endIdx}`;
            if (force || list.dataset.vsig !== sig) {
                list.innerHTML = html;
                list.dataset.vsig = sig;
            }

            measureVisibleGroupHeights(list);
        }

        function scheduleRecordsRender() {
            if (recordsRenderPending) return;
            recordsRenderPending = true;
            requestAnimationFrame(() => {
                recordsRenderPending = false;
                renderVirtualRecords(false);
            });
        }

        function measureVisibleGroupHeights(list) {
            const groups = list.querySelectorAll('[data-date]');
            let changed = false;
            groups.forEach(el => {
                const date = el.getAttribute('data-date');
                const height = el.getBoundingClientRect().height;
                const cached = recordsGroupHeightsByDate.get(date);
                if (!cached || Math.abs(cached - height) > 2) {
                    recordsGroupHeightsByDate.set(date, height);
                    changed = true;
                }
            });
            if (changed) {
                recordsGroupHeights = recordsGroups.map(g => recordsGroupHeightsByDate.get(g.date) || g.height);
                recordsTotalHeight = recordsGroupHeights.reduce((s, h) => s + h, 0);
                if (!recordsHeightUpdatePending) {
                    recordsHeightUpdatePending = true;
                    requestAnimationFrame(() => {
                        recordsHeightUpdatePending = false;
                        renderVirtualRecords(true);
                    });
                }
            }
        }

        // --- 统计与杂项 ---

        function runAnalysis() {
            const start = document.getElementById('start-date').value;
            const end = document.getElementById('end-date').value;
            let filtered = expenses;
            if(start) filtered = filtered.filter(e => e.date >= start);
            if(end) filtered = filtered.filter(e => e.date <= end);
            
            const total = filtered.reduce((s,e)=>s+e.amount,0);
            document.getElementById('total-expense').textContent = '¥' + total.toFixed(2);

            const catMap = {};
            filtered.forEach(e => catMap[e.category] = (catMap[e.category]||0) + e.amount);
            let topCat = '-', maxVal = 0;
            for(let c in catMap) { if(catMap[c]>maxVal){maxVal=catMap[c]; topCat=c;} }
            document.getElementById('top-category').textContent = topCat;

            if(categoryChart) categoryChart.destroy();
            categoryChart = new Chart(document.getElementById('category-chart'), { type: 'doughnut', data: { labels: Object.keys(catMap), datasets: [{ data: Object.values(catMap), backgroundColor: ['#6366f1','#818cf8','#a5b4fc','#c7d2fe','#e0e7ff','#10b981','#34d399','#f59e0b','#fbbf24','#f87171'], borderWidth: 0 }] }, options: { cutout: '70%', plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, font: {size: 10} } } } } });

            const rigidSum = filtered.filter(e=>e.isRigid).reduce((s,e)=>s+e.amount,0);
            const nonRigidSum = total - rigidSum;
            if(rigidChart) rigidChart.destroy();
            rigidChart = new Chart(document.getElementById('rigid-chart'), { type: 'pie', data: { labels: ['刚性','非刚性'], datasets: [{ data: [rigidSum, nonRigidSum], backgroundColor: ['#10b981','#f59e0b'], borderWidth: 0 }] }, options: { plugins: { legend: { display: false } } } });

            const monthMap = {};
            filtered.forEach(e => { const m = e.date.substring(5,7)+'月'; monthMap[m] = (monthMap[m]||0) + e.amount; });
            const sortedMonths = Object.keys(monthMap).sort();
            if(monthlyChart) monthlyChart.destroy();
            monthlyChart = new Chart(document.getElementById('monthly-chart'), { type: 'bar', data: { labels: sortedMonths, datasets: [{ label: '支出', data: sortedMonths.map(m=>monthMap[m]), backgroundColor: '#6366f1', borderRadius: 4, barThickness: 12 }] }, options: { scales: { y: { display: false, beginAtZero: true }, x: { grid: { display: false } } }, plugins: { legend: { display: false } } } });

            // --- 财务健康度计算 ---
            const rigidRatio = total > 0 ? (rigidSum / total) * 100 : 0;
            const healthValEl = document.getElementById('rigid-ratio-val');
            const healthBarEl = document.getElementById('rigid-ratio-bar');
            const healthTextEl = document.getElementById('health-check-text');

            if(healthValEl) healthValEl.textContent = rigidRatio.toFixed(1) + '%';
            if(healthBarEl) healthBarEl.style.width = rigidRatio + '%';
            
            let healthText = '';
            if(rigidRatio > 70) {
                healthText = "刚性支出较多，您在外面吃喝比例不高哟~ 👍";
            } else if(rigidRatio > 40) {
                healthText = "刚性与非刚性支出比例平衡，生活很健康！ ⚖️";
            } else {
                healthText = "非刚性支出占比较高，建议适当控制享乐型消费哦~ 💡";
            }
            if(healthTextEl) healthTextEl.textContent = healthText;

            document.getElementById('analysis-result').classList.remove('hidden');
        }

        function printData() {
            const container = document.getElementById('print-container');
            const totalAmount = expenses.reduce((sum, item) => sum + item.amount, 0).toFixed(2);
            let html = `<div class="print-header"><div class="print-title">家庭账单</div><div class="print-meta"><span>日期: ${new Date().toLocaleDateString()}</span></div></div><table class="print-table"><thead><tr><th>日期</th><th>分类</th><th>备注</th><th>类型</th><th style="text-align:right">金额</th></tr></thead><tbody>`;
            expenses.forEach(e => {
                const safeDate = escapeHtml(e.date);
                const safeCategory = escapeHtml(e.category);
                const safeDesc = escapeHtml(e.desc || '-');
                html += `<tr><td>${safeDate}</td><td>${safeCategory}</td><td style="color:#555">${safeDesc}</td><td class="${e.isRigid ? 'print-type-rigid' : ''}">${e.isRigid ? '刚性' : '非刚性'}</td><td class="print-amount">¥${e.amount.toFixed(2)}</td></tr>`;
            });
            html += `</tbody></table><div class="print-footer">总计: ¥${totalAmount}</div>`;
            container.innerHTML = html;
            setTimeout(() => { window.print(); }, 100);
        }

        function exportData() {
            const dataStr = JSON.stringify(expenses, null, 2);
            const blob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `小账本备份_${new Date().toISOString().slice(0,10)}.json`; a.click();
            setTimeout(() => URL.revokeObjectURL(url), 0);
            saveBackupMeta();
        }

        function importData(e) {
            const file = e.target.files[0];
            if(!file) return;
            if (file.size > MAX_IMPORT_BYTES) {
                alert('导入失败：文件过大，请分批导入或先压缩记录数量。');
                return;
            }
            const reader = new FileReader();
            reader.onload = async function(ev) {
                try {
                    const imported = JSON.parse(ev.target.result);
                    if(Array.isArray(imported)) {
                        if (imported.length > MAX_IMPORT_RECORDS) {
                            const go = confirm(`检测到 ${imported.length} 条记录，数量过大可能导致卡顿。是否继续导入？`);
                            if (!go) return;
                        }
                        const prepared = prepareImportData(imported);
                        if (prepared.valid.length === 0) {
                            alert('文件中没有可用的记录');
                            return;
                        }
                        const prev = expenses;
                        const summary = `检测到 ${prepared.total} 条记录：有效 ${prepared.valid.length}，无效 ${prepared.invalidCount}，重复ID ${prepared.duplicateIdCount}。是否继续导入？`;
                        if (!confirm(summary)) return;
                        if(confirm(`导入方式：点击“确定”覆盖现有数据，点击“取消”合并数据。`)) {
                             expenses = prepared.valid; 
                        } else {
                            // 智能合并：处理ID冲突
                            const existingIds = new Set(expenses.map(e => e.id));
                            const cleanImported = prepared.valid.map(item => {
                                if (existingIds.has(item.id)) {
                                    // ID 冲突，生成新 ID
                                    return { ...item, id: generateId() };
                                }
                                return item;
                            });
                            expenses = expenses.concat(cleanImported);
                        }
                        const ok = await saveData();
                        if (!ok) {
                            expenses = prev;
                            return;
                        }
                        alert('导入成功'); location.reload();
                    }
                } catch(err) { alert('文件错误或格式不正确'); console.error(err); }
            };
            reader.readAsText(file);
        }

        async function clearAllData() {
            if (!confirm('此操作不可恢复，确定清空？')) return;
            const prev = expenses;
            expenses = [];
            if (supportsIndexedDB()) {
                const ok = await idbClear();
                localStorage.removeItem(STORAGE_KEY);
                if (!ok) {
                    expenses = prev;
                    alert('清空失败：请稍后再试。');
                    return;
                }
            } else {
                try {
                    localStorage.removeItem(STORAGE_KEY);
                } catch (e) {
                    expenses = prev;
                    alert('清空失败：请稍后再试。');
                    return;
                }
            }
            location.reload();
        }

        window.onload = async function() {
            await loadData();
            await initStorage();
            const today = new Date().toISOString().slice(0,10);
            if(document.getElementById('date')) document.getElementById('date').value = today;
            if(document.getElementById('custom-start')) document.getElementById('custom-start').value = new Date(new Date().setDate(new Date().getDate()-30)).toISOString().slice(0,10);
            if(document.getElementById('custom-end')) document.getElementById('custom-end').value = today;
            if(document.getElementById('start-date')) document.getElementById('start-date').value = new Date(new Date().getFullYear(), 0, 1).toISOString().slice(0,10);
            if(document.getElementById('end-date')) document.getElementById('end-date').value = today;

            renderCategoryGrid();
            renderQuickFilters();
            switchPage(0);
            renderHome();
            const scroller = document.getElementById('content-area');
            if (scroller) scroller.addEventListener('scroll', scheduleRecordsRender, { passive: true });
        };
    </script>
