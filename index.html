<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭小账本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .nav-active { color: #4f46e5; border-bottom: 3px solid #4f46e5; }
        
        /* 呼吸光影 */
        @keyframes breathe { 0%,100% { box-shadow: 0 0 15px -5px rgba(99,102,241,0.4); } 50% { box-shadow: 0 0 40px 8px rgba(167,139,250,0.55); } }
        .breathe { animation: breathe 5s ease-in-out infinite; }
        .breathe-btn { animation: breathe 4s ease-in-out infinite; }
        .header-glow { animation: breathe 7s ease-in-out infinite; }

        /* 大卡通图标 */
        .cat-btn {
            width: 66px; height: 66px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 20px; font-size: 34px;
            transition: all 0.2s; border: 2px solid transparent;
        }
        .cat-btn:hover { transform: scale(1.12); }
        .cat-btn.active {
            border-color: #4f46e5; background: #f0f9ff;
            transform: scale(1.18); box-shadow: 0 0 0 5px rgba(79,70,229,0.15);
        }
        .cat-btn span { font-size: 11px; margin-top: 3px; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden flex flex-col">
        <!-- 新Header（匹配你截图） -->
        <header class="bg-gradient-to-r from-indigo-500 to-violet-500 text-white p-5 flex items-center justify-between header-glow">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 rounded-2xl flex items-center justify-center">
                    <i class="fa-solid fa-wallet text-3xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold">家庭小账本</h1>
                    <p class="text-xs opacity-75">科技记账 · 轻松生活</p>
                </div>
            </div>
            <div class="text-right">
                <div id="total-month" class="font-mono font-bold text-2xl">¥0.00</div>
                <div class="text-xs opacity-75 -mt-1">本月</div>
            </div>
        </header>

        <!-- 首页 -->
        <div class="flex-1 overflow-auto p-4" id="page-home">
            <div class="bg-white rounded-3xl shadow p-6 mb-6 breathe">
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2"><i class="fa-solid fa-plus-circle"></i> 快速记录</h2>
                <div class="space-y-5">
                    <input id="amount" type="number" step="0.01" placeholder="金额" class="w-full px-4 py-3.5 border border-slate-200 rounded-2xl focus:outline-none focus:border-indigo-500 text-xl">
                    <input id="date" type="date" class="w-full px-4 py-3.5 border border-slate-200 rounded-2xl focus:outline-none focus:border-indigo-500">

                    <div>
                        <div class="text-sm text-slate-500 mb-3">支出类型</div>
                        <div id="category-grid" class="grid grid-cols-5 gap-3"></div>
                    </div>

                    <label class="flex items-center gap-3 text-base">
                        <input id="isRigid" type="checkbox" class="w-6 h-6 accent-indigo-500">
                        <span class="font-medium">刚性支出</span>
                    </label>
                    <input id="desc" type="text" placeholder="备注（可选）" class="w-full px-4 py-3.5 border border-slate-200 rounded-2xl focus:outline-none focus:border-indigo-500">
                    <button onclick="addExpense()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-2xl font-semibold text-lg shadow-lg breathe-btn">立即记账</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white rounded-3xl p-5 shadow text-center">
                    <div class="text-emerald-500 text-3xl font-bold" id="rigid-count">0</div>
                    <div class="text-xs text-slate-500 mt-1">刚性支出</div>
                </div>
                <div class="bg-white rounded-3xl p-5 shadow text-center">
                    <div class="text-amber-500 text-3xl font-bold" id="non-rigid-count">0</div>
                    <div class="text-xs text-slate-500 mt-1">非刚性支出</div>
                </div>
            </div>
            <h3 class="font-semibold mb-3 px-1">最近记录</h3>
            <div id="recent-list" class="space-y-3"></div>
        </div>

        <!-- 记录页面（新增快速筛选） -->
        <div class="hidden flex-1 overflow-auto p-4" id="page-records">
            <div class="mb-4">
                <div id="quick-filters" class="grid grid-cols-4 gap-2"></div>
            </div>
            <div class="flex gap-3 mb-4">
                <select id="year-filter" onchange="renderRecords()" class="flex-1 px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:border-indigo-500"></select>
            </div>
            <div id="records-list" class="space-y-3"></div>
        </div>

        <!-- 分析页面（上下结构） -->
        <div class="hidden flex-1 overflow-auto p-4" id="page-analysis">
            <div class="bg-white rounded-3xl p-6 mb-6 space-y-5">
                <div>
                    <label class="text-xs text-slate-500 block mb-1">开始日期</label>
                    <input id="start-date" type="date" class="w-full px-4 py-3 border border-slate-200 rounded-2xl">
                </div>
                <div>
                    <label class="text-xs text-slate-500 block mb-1">结束日期</label>
                    <input id="end-date" type="date" class="w-full px-4 py-3 border border-slate-200 rounded-2xl">
                </div>
                <button onclick="runAnalysis()" class="mt-2 w-full bg-gradient-to-r from-indigo-500 to-violet-500 text-white py-4 rounded-2xl font-semibold">开始分析</button>
            </div>

            <div id="analysis-result" class="hidden space-y-8">
                <div class="bg-white rounded-3xl p-6 shadow">
                    <h4 class="font-semibold mb-3">总支出</h4>
                    <div id="total-expense" class="text-5xl font-bold text-indigo-600">¥0.00</div>
                </div>
                <div class="space-y-6">
                    <div class="bg-white rounded-3xl p-6 shadow">
                        <canvas id="category-chart" height="220"></canvas>
                    </div>
                    <div class="bg-white rounded-3xl p-6 shadow">
                        <canvas id="rigid-chart" height="180"></canvas>
                    </div>
                    <div class="bg-white rounded-3xl p-6 shadow">
                        <canvas id="monthly-chart" height="180"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- 工具页面 -->
        <div class="hidden flex-1 overflow-auto p-4" id="page-tools">
            <div class="space-y-4">
                <button onclick="exportData()" class="w-full bg-white border border-slate-200 hover:border-indigo-300 py-6 rounded-3xl flex items-center justify-center gap-3 text-lg font-medium">
                    <i class="fa-solid fa-download"></i> 导出全部记录（JSON）
                </button>
                <label class="w-full bg-white border border-slate-200 hover:border-indigo-300 py-6 rounded-3xl flex items-center justify-center gap-3 text-lg font-medium cursor-pointer">
                    <i class="fa-solid fa-upload"></i> 导入记录（JSON）
                    <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
                </label>
                <button onclick="if(confirm('确定清空所有数据？')){localStorage.clear();location.reload()}" class="w-full bg-red-50 hover:bg-red-100 text-red-600 py-6 rounded-3xl flex items-center justify-center gap-3 text-lg font-medium">
                    <i class="fa-solid fa-trash"></i> 清空所有数据
                </button>
            </div>
            <div class="mt-12 text-center text-xs text-slate-400">数据仅保存在本地浏览器<br>部署到GitHub Pages后仍保持离线可用</div>
        </div>

        <!-- Bottom Nav -->
        <nav class="bg-white border-t flex text-slate-400">
            <button onclick="switchPage(0)" class="flex-1 py-3 flex flex-col items-center nav-active" id="nav-0"><i class="fa-solid fa-house text-2xl"></i><span class="text-xs mt-1">首页</span></button>
            <button onclick="switchPage(1)" class="flex-1 py-3 flex flex-col items-center" id="nav-1"><i class="fa-solid fa-list text-2xl"></i><span class="text-xs mt-1">记录</span></button>
            <button onclick="switchPage(2)" class="flex-1 py-3 flex flex-col items-center" id="nav-2"><i class="fa-solid fa-chart-pie text-2xl"></i><span class="text-xs mt-1">分析</span></button>
            <button onclick="switchPage(3)" class="flex-1 py-3 flex flex-col items-center" id="nav-3"><i class="fa-solid fa-tools text-2xl"></i><span class="text-xs mt-1">工具</span></button>
        </nav>
    </div>

    <script>
        let expenses = [];
        let selectedCategory = '';
        let categoryChart, rigidChart, monthlyChart;
        let currentFilter = 'all';

        const categories = [
            {name:'餐饮',emoji:'🍔'},{name:'出行',emoji:'🚕'},{name:'子女',emoji:'👨‍👩‍👧'},
            {name:'日用品',emoji:'🛒'},{name:'娱乐',emoji:'🎮'},{name:'医疗',emoji:'🩹'},
            {name:'水电',emoji:'💡'},{name:'通讯',emoji:'📱'},{name:'服装',emoji:'👕'},{name:'其他',emoji:'❓'}
        ];

        function loadData() { const saved = localStorage.getItem('familyExpenses'); expenses = saved ? JSON.parse(saved) : []; }
        function saveData() { localStorage.setItem('familyExpenses', JSON.stringify(expenses)); }

        function renderCategoryGrid() {
            const grid = document.getElementById('category-grid');
            grid.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn bg-white shadow-sm`;
                btn.innerHTML = `<span>${cat.emoji}</span><span>${cat.name}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedCategory = cat.name;
                };
                grid.appendChild(btn);
            });
        }

        function renderQuickFilters() {
            const container = document.getElementById('quick-filters');
            const filters = [
                {text:'本月',val:'thisMonth'},
                {text:'上月',val:'lastMonth'},
                {text:'本年',val:'thisYear'},
                {text:'Q1',val:'Q1'},
                {text:'Q2',val:'Q2'},
                {text:'Q3',val:'Q3'},
                {text:'Q4',val:'Q4'}
            ];
            container.innerHTML = filters.map(f => `
                <button onclick="setQuickFilter('${f.val}')" class="py-2 px-3 text-sm rounded-2xl border border-slate-200 hover:border-indigo-400 ${currentFilter===f.val?'bg-indigo-100 border-indigo-500':''}">${f.text}</button>
            `).join('');
        }

        function setQuickFilter(mode) {
            currentFilter = mode;
            renderQuickFilters();
            renderRecords();
        }

        function switchPage(n) {
            document.querySelectorAll('#page-home, #page-records, #page-analysis, #page-tools').forEach(p => p.classList.add('hidden'));
            document.getElementById(['page-home','page-records','page-analysis','page-tools'][n]).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach((b,i) => i===n ? b.classList.add('nav-active') : b.classList.remove('nav-active'));
            if(n===1) { renderQuickFilters(); renderRecords(); }
            if(n===2) document.getElementById('analysis-result').classList.add('hidden');
        }

        function addExpense() { /* 与上次完全一致，省略部分代码以节省篇幅，实际已包含 */ 
            const amount = parseFloat(document.getElementById('amount').value);
            const date = document.getElementById('date').value;
            const isRigid = document.getElementById('isRigid').checked;
            const desc = document.getElementById('desc').value.trim();
            if(!amount || !date || !selectedCategory) { alert('请填写金额、日期并选择类型'); return; }
            expenses.unshift({id: Date.now(), date, amount, category: selectedCategory, isRigid, desc: desc || '-'});
            saveData(); renderHome(); alert('记录成功！');
            document.getElementById('amount').value = ''; document.getElementById('desc').value = '';
            selectedCategory = ''; document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        }

        function renderHome() { /* 保持原逻辑 */ 
            const now = new Date();
            const thisMonth = expenses.filter(e => {
                const d = new Date(e.date);
                return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
            });
            document.getElementById('total-month').textContent = '¥' + thisMonth.reduce((s,e)=>s+e.amount,0).toFixed(2);
            document.getElementById('rigid-count').textContent = thisMonth.filter(e=>e.isRigid).length;
            document.getElementById('non-rigid-count').textContent = thisMonth.length - thisMonth.filter(e=>e.isRigid).length;
            const recent = expenses.slice(0,5);
            let html = '';
            recent.forEach(e => {
                html += `<div class="bg-white rounded-2xl p-4 flex justify-between items-center shadow-sm"><div><div class="font-medium">${e.category} ${e.isRigid?'<span class="text-emerald-500 text-xs">刚性</span>':'<span class="text-amber-500 text-xs">非刚性</span>'}</div><div class="text-xs text-slate-500">${e.date} ${e.desc}</div></div><div class="text-right"><div class="font-bold text-lg">¥${e.amount}</div><button onclick="deleteExpense(${e.id});event.stopImmediatePropagation()" class="text-red-400 text-xs">删除</button></div></div>`;
            });
            document.getElementById('recent-list').innerHTML = html || '<p class="text-slate-400 text-center py-8">还没有记录，快去记一笔吧～</p>';
        }

        function deleteExpense(id) {
            if(confirm('确定删除？')) { expenses = expenses.filter(e => e.id !== id); saveData(); renderHome(); renderRecords(); }
        }

        function renderRecords() {
            const yearSelect = document.getElementById('year-filter');
            const years = [...new Set(expenses.map(e => new Date(e.date).getFullYear()))].sort((a,b)=>b-a);
            yearSelect.innerHTML = `<option value="">全部年份</option>` + years.map(y => `<option value="${y}">${y}年</option>`).join('');

            let filtered = expenses;
            const now = new Date();
            const y = now.getFullYear(), m = now.getMonth();

            if (currentFilter === 'thisMonth') {
                filtered = expenses.filter(e => {
                    const d = new Date(e.date);
                    return d.getFullYear() === y && d.getMonth() === m;
                });
            } else if (currentFilter === 'lastMonth') {
                filtered = expenses.filter(e => {
                    const d = new Date(e.date);
                    return d.getFullYear() === y && d.getMonth() === m-1 || (m===0 && d.getMonth()===11 && d.getFullYear()===y-1);
                });
            } else if (currentFilter === 'thisYear') {
                filtered = expenses.filter(e => new Date(e.date).getFullYear() === y);
            } else if (currentFilter.startsWith('Q')) {
                const q = parseInt(currentFilter[1]);
                const startM = (q-1)*3;
                filtered = expenses.filter(e => {
                    const d = new Date(e.date);
                    return d.getFullYear() === y && d.getMonth() >= startM && d.getMonth() < startM+3;
                });
            }

            const selectedYear = yearSelect.value;
            if (selectedYear) filtered = filtered.filter(e => new Date(e.date).getFullYear() == selectedYear);

            let html = '';
            filtered.forEach(e => {
                html += `<div class="bg-white rounded-3xl p-5 shadow flex justify-between"><div><div class="flex items-center gap-2"><span class="font-semibold">${e.category}</span>${e.isRigid?'<span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 text-xs rounded-full">刚性</span>':'<span class="px-2 py-0.5 bg-amber-100 text-amber-700 text-xs rounded-full">非刚性</span>'}</div><div class="text-xs text-slate-500 mt-1">${e.date} · ${e.desc}</div></div><div class="text-right"><div class="text-xl font-bold">¥${e.amount.toFixed(2)}</div><button onclick="deleteExpense(${e.id});event.stopImmediatePropagation()" class="text-red-400 text-xs mt-1">删除</button></div></div>`;
            });
            document.getElementById('records-list').innerHTML = html || '<p class="text-center text-slate-400 py-12">没有记录</p>';
        }

        function runAnalysis() { /* 与上次一致，但图表容器已改为上下布局 */ 
            const start = document.getElementById('start-date').value;
            const end = document.getElementById('end-date').value;
            let filtered = expenses;
            if(start) filtered = filtered.filter(e => e.date >= start);
            if(end) filtered = filtered.filter(e => e.date <= end);

            const total = filtered.reduce((s,e)=>s+e.amount,0);
            document.getElementById('total-expense').textContent = '¥' + total.toFixed(2);

            const catMap = {};
            filtered.forEach(e => catMap[e.category] = (catMap[e.category]||0) + e.amount);
            if(categoryChart) categoryChart.destroy();
            categoryChart = new Chart(document.getElementById('category-chart'), {
                type: 'doughnut',
                data: { labels: Object.keys(catMap), datasets: [{ data: Object.values(catMap), backgroundColor: ['#6366f1','#a5b4fc','#c4d0ff','#818cf8','#4f46e5','#10b981','#f59e0b','#eab308','#ec4899','#8b5cf6'] }] },
                options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 15 } } } }
            });

            const rigidSum = filtered.filter(e=>e.isRigid).reduce((s,e)=>s+e.amount,0);
            const nonRigidSum = total - rigidSum;
            if(rigidChart) rigidChart.destroy();
            rigidChart = new Chart(document.getElementById('rigid-chart'), {
                type: 'pie',
                data: { labels: ['刚性支出','非刚性支出'], datasets: [{ data: [rigidSum, nonRigidSum], backgroundColor: ['#10b981','#f59e0b'] }] },
                options: { plugins: { legend: { position: 'bottom' } } }
            });

            const monthMap = {};
            filtered.forEach(e => {
                const m = e.date.substring(0,7);
                monthMap[m] = (monthMap[m]||0) + e.amount;
            });
            if(monthlyChart) monthlyChart.destroy();
            monthlyChart = new Chart(document.getElementById('monthly-chart'), {
                type: 'bar',
                data: { labels: Object.keys(monthMap), datasets: [{ label: '月支出', data: Object.values(monthMap), backgroundColor: '#6366f1' }] },
                options: { scales: { y: { beginAtZero: true } } }
            });

            document.getElementById('analysis-result').classList.remove('hidden');
        }

        function exportData() { /* 保持不变 */ 
            const dataStr = JSON.stringify(expenses, null, 2);
            const blob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `家庭记账_${new Date().toISOString().slice(0,10)}.json`; a.click();
        }

        function importData(e) { /* 保持不变 */ 
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const imported = JSON.parse(ev.target.result);
                    if(Array.isArray(imported)) {
                        if(confirm(`即将导入 ${imported.length} 条记录，是否覆盖？`)) expenses = imported; else expenses = expenses.concat(imported);
                        saveData(); alert('导入成功！'); renderHome(); switchPage(0);
                    }
                } catch(err) { alert('JSON格式错误'); }
            };
            reader.readAsText(file);
        }

        window.onload = function() {
            loadData();
            document.getElementById('date').value = new Date().toISOString().slice(0,10);
            renderCategoryGrid();
            renderQuickFilters();
            switchPage(0);
            renderHome();
        };
    </script>
</body>
</html>
