<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭小账本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .nav-active { color: #4f46e5; border-bottom: 3px solid #4f46e5; }
        .card { transition: all 0.2s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-slate-100 text-slate-900">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden flex flex-col">
        <!-- Header -->
        <header class="bg-gradient-to-r from-indigo-500 to-violet-500 text-white p-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-wallet text-3xl"></i>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">家庭小账本</h1>
                    <p class="text-xs opacity-75">科技记账 · 轻松生活</p>
                </div>
            </div>
            <div class="text-right text-xs">
                <div id="total-month" class="font-mono font-bold text-lg">¥0.00</div>
                <div class="opacity-75">本月</div>
            </div>
        </header>

        <!-- Pages -->
        <div class="flex-1 overflow-auto p-4" id="page-home">
            <!-- 首页：快速记录 + 最近 -->
            <div class="bg-white rounded-3xl shadow p-6 mb-6">
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2"><i class="fa-solid fa-plus-circle"></i> 快速记录</h2>
                <div class="space-y-4">
                    <input id="amount" type="number" step="0.01" placeholder="金额" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:border-indigo-500 text-lg">
                    <input id="date" type="date" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:border-indigo-500">
                    <select id="category" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:border-indigo-500">
                        <option value="">选择分类</option>
                        <option value="餐饮">餐饮</option>
                        <option value="出行">出行</option>
                        <option value="学习">学习</option>
                        <option value="住宿">住宿</option>
                        <option value="娱乐">娱乐</option>
                        <option value="医疗">医疗</option>
                        <option value="购物">购物</option>
                        <option value="水电费">水电费</option>
                        <option value="通讯费">通讯费</option>
                        <option value="其他">其他</option>
                    </select>
                    <label class="flex items-center gap-2 text-sm">
                        <input id="isRigid" type="checkbox" class="w-5 h-5 accent-indigo-500">
                        <span class="font-medium">刚性支出</span>
                    </label>
                    <input id="desc" type="text" placeholder="备注（可选）" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:border-indigo-500">
                    <button onclick="addExpense()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-2xl font-semibold text-lg shadow-lg">立即记账</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white rounded-3xl p-5 shadow text-center">
                    <div class="text-emerald-500 text-2xl font-bold" id="rigid-count">0</div>
                    <div class="text-xs text-slate-500">刚性支出笔数</div>
                </div>
                <div class="bg-white rounded-3xl p-5 shadow text-center">
                    <div class="text-amber-500 text-2xl font-bold" id="non-rigid-count">0</div>
                    <div class="text-xs text-slate-500">非刚性支出笔数</div>
                </div>
            </div>

            <h3 class="font-semibold mb-3 px-1">最近记录</h3>
            <div id="recent-list" class="space-y-3"></div>
        </div>

        <div class="hidden flex-1 overflow-auto p-4" id="page-records">
            <div class="flex gap-3 mb-4">
                <select id="year-filter" onchange="renderRecords()" class="flex-1 px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:border-indigo-500"></select>
            </div>
            <div id="records-list" class="space-y-3"></div>
        </div>

        <div class="hidden flex-1 overflow-auto p-4" id="page-analysis">
            <div class="bg-white rounded-3xl p-6 mb-6">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-slate-500 block mb-1">开始日期</label>
                        <input id="start-date" type="date" class="w-full px-4 py-3 border border-slate-200 rounded-2xl">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 block mb-1">结束日期</label>
                        <input id="end-date" type="date" class="w-full px-4 py-3 border border-slate-200 rounded-2xl">
                    </div>
                </div>
                <button onclick="runAnalysis()" class="mt-6 w-full bg-gradient-to-r from-indigo-500 to-violet-500 text-white py-4 rounded-2xl font-semibold">开始分析</button>
            </div>

            <div id="analysis-result" class="hidden space-y-8">
                <div class="bg-white rounded-3xl p-6 shadow">
                    <h4 class="font-semibold mb-4">总支出</h4>
                    <div id="total-expense" class="text-4xl font-bold text-indigo-600">¥0.00</div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white rounded-3xl p-6 shadow">
                        <canvas id="category-chart" height="180"></canvas>
                    </div>
                    <div class="bg-white rounded-3xl p-6 shadow">
                        <canvas id="rigid-chart" height="180"></canvas>
                    </div>
                </div>
                <div class="bg-white rounded-3xl p-6 shadow">
                    <canvas id="monthly-chart" height="160"></canvas>
                </div>
            </div>
        </div>

        <div class="hidden flex-1 overflow-auto p-4" id="page-tools">
            <div class="space-y-4">
                <button onclick="exportData()" class="w-full bg-white border border-slate-200 hover:border-indigo-300 py-6 rounded-3xl flex items-center justify-center gap-3 text-lg font-medium">
                    <i class="fa-solid fa-download"></i> 导出全部记录（JSON）
                </button>
                <label class="w-full bg-white border border-slate-200 hover:border-indigo-300 py-6 rounded-3xl flex items-center justify-center gap-3 text-lg font-medium cursor-pointer">
                    <i class="fa-solid fa-upload"></i> 导入记录（JSON）
                    <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
                </label>
                <button onclick="if(confirm('确定清空所有数据？')){localStorage.clear();location.reload()}" class="w-full bg-red-50 hover:bg-red-100 text-red-600 py-6 rounded-3xl flex items-center justify-center gap-3 text-lg font-medium">
                    <i class="fa-solid fa-trash"></i> 清空所有数据
                </button>
            </div>
            <div class="mt-12 text-center text-xs text-slate-400">数据仅保存在本地浏览器<br>部署到GitHub Pages后仍保持离线可用</div>
        </div>

        <!-- Bottom Nav -->
        <nav class="bg-white border-t flex text-slate-400">
            <button onclick="switchPage(0)" class="flex-1 py-3 flex flex-col items-center nav-active" id="nav-0"><i class="fa-solid fa-house text-xl"></i><span class="text-[10px] mt-1">首页</span></button>
            <button onclick="switchPage(1)" class="flex-1 py-3 flex flex-col items-center" id="nav-1"><i class="fa-solid fa-list text-xl"></i><span class="text-[10px] mt-1">记录</span></button>
            <button onclick="switchPage(2)" class="flex-1 py-3 flex flex-col items-center" id="nav-2"><i class="fa-solid fa-chart-pie text-xl"></i><span class="text-[10px] mt-1">分析</span></button>
            <button onclick="switchPage(3)" class="flex-1 py-3 flex flex-col items-center" id="nav-3"><i class="fa-solid fa-tools text-xl"></i><span class="text-[10px] mt-1">工具</span></button>
        </nav>
    </div>

    <script>
        let expenses = [];
        let categoryChart, rigidChart, monthlyChart;

        const categories = ["餐饮","出行","学习","住宿","娱乐","医疗","购物","水电费","通讯费","其他"];

        function loadData() {
            const saved = localStorage.getItem('familyExpenses');
            expenses = saved ? JSON.parse(saved) : [];
        }

        function saveData() {
            localStorage.setItem('familyExpenses', JSON.stringify(expenses));
        }

        function switchPage(n) {
            document.querySelectorAll('#page-home, #page-records, #page-analysis, #page-tools').forEach(p => p.classList.add('hidden'));
            document.getElementById(['page-home','page-records','page-analysis','page-tools'][n]).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach((b,i) => i===n ? b.classList.add('nav-active') : b.classList.remove('nav-active'));
            if(n===1) renderRecords();
            if(n===2) document.getElementById('analysis-result').classList.add('hidden');
        }

        function addExpense() {
            const amount = parseFloat(document.getElementById('amount').value);
            const date = document.getElementById('date').value;
            const category = document.getElementById('category').value;
            const isRigid = document.getElementById('isRigid').checked;
            const desc = document.getElementById('desc').value.trim();

            if(!amount || !date || !category) {
                alert('请填写金额、日期和分类');
                return;
            }

            expenses.unshift({
                id: Date.now(),
                date,
                amount,
                category,
                isRigid,
                desc: desc || '-'
            });

            saveData();
            renderHome();
            alert('记录成功！');
            // 清空表单
            document.getElementById('amount').value = '';
            document.getElementById('desc').value = '';
        }

        function renderHome() {
            // 本月总计
            const now = new Date();
            const thisMonth = expenses.filter(e => {
                const d = new Date(e.date);
                return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
            });
            const monthTotal = thisMonth.reduce((sum, e) => sum + e.amount, 0);
            document.getElementById('total-month').textContent = '¥' + monthTotal.toFixed(2);

            // 刚性/非刚性计数
            const rigidCount = thisMonth.filter(e => e.isRigid).length;
            const nonRigidCount = thisMonth.length - rigidCount;
            document.getElementById('rigid-count').textContent = rigidCount;
            document.getElementById('non-rigid-count').textContent = nonRigidCount;

            // 最近5条
            const recent = expenses.slice(0, 5);
            let html = '';
            recent.forEach(e => {
                html += `
                    <div class="bg-white rounded-2xl p-4 flex justify-between items-center shadow-sm">
                        <div>
                            <div class="font-medium">${e.category} ${e.isRigid ? '<span class="text-emerald-500 text-xs">刚性</span>' : '<span class="text-amber-500 text-xs">非刚性</span>'}</div>
                            <div class="text-xs text-slate-500">${e.date} ${e.desc}</div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-lg">¥${e.amount}</div>
                            <button onclick="deleteExpense(${e.id});event.stopImmediatePropagation()" class="text-red-400 text-xs">删除</button>
                        </div>
                    </div>`;
            });
            document.getElementById('recent-list').innerHTML = html || '<p class="text-slate-400 text-center py-8">还没有记录，快去记一笔吧～</p>';
        }

        function deleteExpense(id) {
            if(confirm('确定删除这条记录？')) {
                expenses = expenses.filter(e => e.id !== id);
                saveData();
                renderHome();
                renderRecords();
            }
        }

        function renderRecords() {
            const yearSelect = document.getElementById('year-filter');
            const years = [...new Set(expenses.map(e => new Date(e.date).getFullYear()))].sort((a,b)=>b-a);
            yearSelect.innerHTML = `<option value="">全部年份</option>` + years.map(y => `<option value="${y}">${y}年</option>`).join('');

            const selectedYear = yearSelect.value;
            const filtered = selectedYear ? expenses.filter(e => new Date(e.date).getFullYear() == selectedYear) : expenses;

            let html = '';
            filtered.forEach(e => {
                html += `
                    <div class="bg-white rounded-3xl p-5 shadow flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-semibold">${e.category}</span>
                                ${e.isRigid ? `<span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 text-xs rounded-full">刚性</span>` : `<span class="px-2 py-0.5 bg-amber-100 text-amber-700 text-xs rounded-full">非刚性</span>`}
                            </div>
                            <div class="text-xs text-slate-500 mt-1">${e.date} · ${e.desc}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-xl font-bold">¥${e.amount.toFixed(2)}</div>
                            <button onclick="deleteExpense(${e.id});event.stopImmediatePropagation()" class="text-red-400 text-xs mt-1">删除</button>
                        </div>
                    </div>`;
            });
            document.getElementById('records-list').innerHTML = html || '<p class="text-center text-slate-400 py-12">该年份没有记录</p>';
        }

        function runAnalysis() {
            const start = document.getElementById('start-date').value;
            const end = document.getElementById('end-date').value;
            let filtered = expenses;
            if(start) filtered = filtered.filter(e => e.date >= start);
            if(end) filtered = filtered.filter(e => e.date <= end);

            const total = filtered.reduce((s,e)=>s+e.amount,0);
            document.getElementById('total-expense').textContent = '¥' + total.toFixed(2);

            // 类别饼图
            const catMap = {};
            filtered.forEach(e => catMap[e.category] = (catMap[e.category]||0) + e.amount);
            if(categoryChart) categoryChart.destroy();
            categoryChart = new Chart(document.getElementById('category-chart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catMap),
                    datasets: [{ data: Object.values(catMap), backgroundColor: ['#6366f1','#a5b4fc','#c4d0ff','#818cf8','#4f46e5'] }]
                },
                options: { plugins: { legend: { position: 'bottom' } } }
            });

            // 刚性饼图
            const rigidSum = filtered.filter(e=>e.isRigid).reduce((s,e)=>s+e.amount,0);
            const nonRigidSum = total - rigidSum;
            if(rigidChart) rigidChart.destroy();
            rigidChart = new Chart(document.getElementById('rigid-chart'), {
                type: 'pie',
                data: {
                    labels: ['刚性支出','非刚性支出'],
                    datasets: [{ data: [rigidSum, nonRigidSum], backgroundColor: ['#10b981','#f59e0b'] }]
                },
                options: { plugins: { legend: { position: 'bottom' } } }
            });

            // 月度柱状
            const monthMap = {};
            filtered.forEach(e => {
                const m = e.date.substring(0,7);
                monthMap[m] = (monthMap[m]||0) + e.amount;
            });
            if(monthlyChart) monthlyChart.destroy();
            monthlyChart = new Chart(document.getElementById('monthly-chart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(monthMap),
                    datasets: [{ label: '月支出', data: Object.values(monthMap), backgroundColor: '#6366f1' }]
                },
                options: { scales: { y: { beginAtZero: true } } }
            });

            document.getElementById('analysis-result').classList.remove('hidden');
        }

        function exportData() {
            const dataStr = JSON.stringify(expenses, null, 2);
            const blob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `家庭记账_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const imported = JSON.parse(ev.target.result);
                    if(Array.isArray(imported)) {
                        if(confirm(`即将导入 ${imported.length} 条记录，是否覆盖当前数据？`)) {
                            expenses = imported;
                        } else {
                            expenses = expenses.concat(imported);
                        }
                        saveData();
                        alert('导入成功！');
                        renderHome();
                        switchPage(0);
                    }
                } catch(err) {
                    alert('JSON格式错误，请检查文件');
                }
            };
            reader.readAsText(file);
        }

        // 初始化
        window.onload = function() {
            loadData();
            document.getElementById('date').value = new Date().toISOString().slice(0,10);
            switchPage(0);
            renderHome();
        };
    </script>
</body>
</html>
